# Do NOT commit a real secret. Prefer:
#   kubectl -n argocd patch secret argocd-secret -p \
#     '{"stringData": {"webhook.github.secret": "<RANDOM_STRING>"}}'
# Generate one with: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret
  namespace: argocd
stringData:
  webhook.github.secret: "REPLACE_ME"
