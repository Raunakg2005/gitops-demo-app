# Stage 1: manual sync. Nothing deploys until you click SYNC (or run `argocd app sync`).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Raunakg2005/gitops-demo-app.git
    targetRevision: HEAD
    path: k8s            # folder holding the Kubernetes manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
